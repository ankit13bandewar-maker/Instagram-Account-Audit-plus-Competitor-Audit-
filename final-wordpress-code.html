/* ============================================================
   AURA Audit — BloomX
   Space Grotesk (display) · Manrope (body)
   ============================================================ */

@import url(&#x27;https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap&#x27;);

/* ── Palette tokens ─────────────────────────────────────────── */
:root {
  --font-d: &#x27;Space Grotesk&#x27;, ui-sans-serif, system-ui, sans-serif;
  --font-b: &#x27;Manrope&#x27;, ui-sans-serif, system-ui, sans-serif;

  /* Typography System */
  --h1-size: 24px;
  --h1-weight: 600;
  --h1-lh: 1.3;
  --h1-ls: -0.01em;

  --h2-size: 14px;
  --h2-weight: 500;
  --h2-lh: 1.4;
  --h2-ls: 0em;


  /* Lime Noir (default) */
  --bg: #0A0A0E;
  --bg2: #0E0E14;
  --surf: #15151D;
  --surf2: #1C1C26;
  --surf3: #23232F;
  --border: rgba(255, 255, 255, .075);
  --border-s: rgba(255, 255, 255, .16);
  --text: #F3F3F6;
  --muted: #8E8E9E;
  --faint: #5C5C6B;
  --accent: #C6FF3A;
  --acc2: #C6FF3A;
  --acc-ink: #0A0A0E;
  --pos: #54E08A;
  --neg: #FF6363;
  --warn: #FFC24B;
  --grid: rgba(255, 255, 255, .06);
  --ring: rgba(198, 255, 58, .22);
  --glow: none;

  --gap: 20px;
  --pad: 22px;
  --rad: 16px;
}

/* ── Palette variants ───────────────────────────────────────── */
[data-palette=&quot;violet&quot;] {
  --bg: #08070D;
  --bg2: #0C0B14;
  --surf: #15131F;
  --surf2: #1C1A2A;
  --surf3: #242235;
  --border: rgba(255, 255, 255, .08);
  --border-s: rgba(255, 255, 255, .17);
  --text: #F3F1F8;
  --muted: #938FA8;
  --faint: #5e5a73;
  --accent: #9B7CFF;
  --acc2: #C9B6FF;
  --acc-ink: #0A0814;
  --pos: #54E08A;
  --neg: #FF6B85;
  --warn: #FFC24B;
  --ring: rgba(155, 124, 255, .28);
}

[data-palette=&quot;green&quot;] {
  --bg: #070C09;
  --bg2: #0A110D;
  --surf: #101813;
  --surf2: #17211B;
  --surf3: #1F2C24;
  --border: rgba(255, 255, 255, .07);
  --border-s: rgba(255, 255, 255, .15);
  --text: #EFF5F0;
  --muted: #7F8F86;
  --faint: #54635A;
  --accent: #2BD27A;
  --acc2: #6BF0AC;
  --acc-ink: #04140B;
  --pos: #54E08A;
  --neg: #FF6B6B;
  --warn: #FFC24B;
  --ring: rgba(43, 210, 122, .26);
}

[data-palette=&quot;light&quot;] {
  --bg: #EFF0F3;
  --bg2: #F5F6F8;
  --surf: #FFFFFF;
  --surf2: #F4F5F8;
  --surf3: #ECEEF2;
  --border: rgba(15, 17, 26, .10);
  --border-s: rgba(15, 17, 26, .18);
  --text: #13141A;
  --muted: #5E6472;
  --faint: #9AA0AE;
  --accent: #16161C;
  --acc2: #16161C;
  --acc-ink: #FFFFFF;
  --pos: #15A75B;
  --neg: #E0394B;
  --warn: #C98A12;
  --grid: rgba(15, 17, 26, .07);
  --ring: rgba(15, 17, 26, .15);
}

[data-glow=&quot;on&quot;] {
  --glow: 0 0 22px -5px var(--ring);
}

[data-density=&quot;compact&quot;] {
  --gap: 14px;
  --pad: 16px;
  --rad: 13px;
}

[data-density=&quot;comfy&quot;] {
  --gap: 28px;
  --pad: 30px;
  --rad: 20px;
}

/* ── Reset &amp; base ───────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body { margin: 0; padding: 0; 
  margin: 0;
  padding: 0;
}

body { margin: 0; padding: 0; 
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--accent);
  color: var(--acc-ink);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  cursor: pointer;
  font-family: inherit;
}

/* ── Shell ──────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 272px 1fr;
  min-height: 100vh;
}

@media (max-width: 1080px) {
  .app {
    grid-template-columns: 1fr;
  }
}

/* ── Sidebar ────────────────────────────────────────────────── */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

@media (max-width: 1080px) {
  .sidebar {
    position: relative;
    height: auto;
  }
}

.sb-head {
  padding: 20px 18px 12px;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-b);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.eyebrow::before {
  content: &#x27;&#x27;;
  width: 7px;
  height: 7px;
  background: var(--accent);
  border-radius: 2px;
  flex: none;
  box-shadow: var(--glow);
}

.sb-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sb-scroll::-webkit-scrollbar {
  width: 6px;
}

.sb-scroll::-webkit-scrollbar-thumb {
  background: var(--surf2);
  border-radius: 6px;
  border: 2px solid var(--bg2);
}

.acct {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 11px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .14s, border-color .14s;
}

.acct:hover {
  background: var(--surf);
}

.acct.active {
  background: var(--surf);
  border-color: var(--border);
}

.acct.active .av {
  box-shadow: 0 0 0 2px var(--accent);
}

.av {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  flex: none;
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 12px;
  background: var(--surf2);
  border: 1px solid var(--border);
}

.acct-meta {
  flex: 1;
  min-width: 0;
}

.acct-meta .h {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.acct-meta .s {
  font-size: 11px;
  color: var(--faint);
}

.er {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 12px;
  flex: none;
}

.er.up {
  color: var(--pos);
}

.er.dn {
  color: var(--neg);
}

.er.mid {
  color: var(--muted);
}

.sb-brand {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.sb-brand .logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sb-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--acc-ink);
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 16px;
  box-shadow: var(--glow);
}

.sb-name {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -.01em;
}

.sb-ver {
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 6px;
}

/* ── Topbar ─────────────────────────────────────────────────── */
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: relative;
  z-index: 30;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 14px clamp(20px, 3.5vw, 44px);
}

.tb-inner {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 20px;
  max-width: 1320px;
  margin: 0 auto;
}

.tb-title h1 {
  font-family: var(--font-d);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-ls);
  margin: 0;
}

.tb-title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
  max-width: 480px;
}

.auditor {
  display: flex;
  gap: 8px;
  align-items: stretch;
  flex: 1;
  min-width: 280px;
  max-width: 100%;
}

.url-field {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 13px;
  height: 44px;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: border-color .16s, box-shadow .16s;
}

.url-field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring);
}

.url-field svg {
  flex: none;
  color: var(--faint);
}

.url-field input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: var(--text);
  font-family: var(--font-b);
  font-size: 13px;
  min-width: 0;
}

.url-field input::placeholder {
  color: var(--faint);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 0;
  border-radius: 12px;
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: filter .16s, transform .12s;
}

.btn-cta {
  padding: 0 20px;
  height: 44px;
  background: #00CEF1;
  color: #06080A;
  box-shadow: var(--glow);
}

.btn-cta:hover {
  filter: brightness(1.07);
  transform: translateY(-1px);
}

.btn-cta:active {
  transform: translateY(0);
}

.btn-ghost {
  padding: 0 12px;
  height: 32px;
  background: var(--surf);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 10.5px;
}

.btn-ghost:hover {
  border-color: var(--border-s);
  background: var(--surf2);
}

/* ── Content area ───────────────────────────────────────────── */
.content {
  padding: clamp(18px, 2.6vw, 28px) clamp(20px, 3.5vw, 44px) 80px;
}

.wrap {
  max-width: 1320px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* ── Card ───────────────────────────────────────────────────── */
.card {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--rad);
  padding: var(--pad);
}

.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.card-h .t {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-b);
  font-weight: var(--h2-weight);
  font-size: var(--h2-size);
  line-height: var(--h2-lh);
  letter-spacing: var(--h2-ls);
  margin: 0;
  padding: 0;
}

.card-h .ico {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--surf2);
  display: grid;
  place-items: center;
  color: var(--accent);
  flex: none;
  font-size: 13px;
}

.card-sub {
  font-family: var(--font-b);
  font-weight: var(--h2-weight);
  font-size: var(--h2-size);
  line-height: var(--h2-lh);
  letter-spacing: var(--h2-ls);
  color: var(--muted);
  margin: -8px 0 16px;
  padding: 0;
}

/* ── Grid ───────────────────────────────────────────────────── */
.grid {
  display: grid;
  gap: var(--gap);
}

.g4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.g3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.g2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 980px) {
  .g4 {
    grid-template-columns: repeat(2, 1fr);
  }

  .g3,
  .g2 {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 540px) {
  .g4 {
    grid-template-columns: 1fr;
  }
}

/* ── Pill ───────────────────────────────────────────────────── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  border: 1px solid var(--border);
  background: var(--surf2);
  color: var(--muted);
}

.pill.win {
  color: var(--accent);
  border-color: color-mix(in oklab, var(--accent) 38%, transparent);
  background: color-mix(in oklab, var(--accent) 11%, var(--surf));
}

.pill.dot::before {
  content: &#x27;&#x27;;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ── Profile strip ──────────────────────────────────────────── */
.profile-strip {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px 18px;
  background: linear-gradient(120deg, var(--surf), var(--surf2));
  border: 1px solid var(--border);
  border-radius: var(--rad);
}

.ps-av {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: var(--surf2);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 15px;
}

.ps-handle {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ps-handle span {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 17px;
}

.ps-verified {
  color: var(--accent);
  line-height: 0;
}

.ps-div {
  width: 1px;
  height: 32px;
  background: var(--border);
}

.ps-stat .k {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #ffffff;
  margin-bottom: 2px;
}

.ps-stat .v {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 18px;
  color: var(--accent);
}

.ps-spacer {
  flex: 1;
}

/* ── Metric card ────────────────────────────────────────────── */
.metric {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 145px;
}

.metric-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.metric .label {
  font-family: var(--font-d);
  font-size: 13px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text);
  font-weight: 800;
  line-height: 1.4;
}

.metric .big {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: clamp(32px, 4vw, 46px);
  line-height: .92;
  letter-spacing: -.025em;
  margin-top: auto;
  color: var(--accent);
}

.metric .big .u {
  font-size: .38em;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0;
  margin-left: 3px;
}

.metric .desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
}

.grid.g4 {
  grid-template-columns: 1fr 1fr;
}

@media (max-width: 768px) {
  .grid.g4 {
    grid-template-columns: 1fr;
  }
}

.metric-ico {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--surf2);
  display: grid;
  place-items: center;
  font-size: 14px;
  flex: none;
}

.metric.good .big {
  color: var(--accent);
}

.metric.warnv .big {
  color: var(--warn);
}

.metric.pos .big {
  color: var(--pos);
}

/* ── Battle ─────────────────────────────────────────────────── */
.battle {
  display: grid;
  grid-template-columns: 1fr 48px 1fr;
  align-items: start;
}

@media (max-width: 680px) {
  .battle {
    grid-template-columns: 1fr;
  }
}

.battle-side {
  padding: 4px 6px;
}

.bs-label {
  font-size: 10px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.bs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.bs-num {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: clamp(36px, 5vw, 54px);
  line-height: .9;
  letter-spacing: -.03em;
}

.bs-sub {
  font-size: 10.5px;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-top: 4px;
}

.bs-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
}

.battle.winR .battle-side.right .bs-num,
.battle.winL .battle-side.left .bs-num {
  color: var(--accent);
}

.battle.winR .battle-side.left .bs-num,
.battle.winL .battle-side.right .bs-num {
  color: var(--neg);
}

.vs-col {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 38px;
  position: relative;
}

.vs-col::before {
  content: &#x27;&#x27;;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: var(--border);
}

.vs-badge {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 11px;
  color: var(--faint);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg);
  display: grid;
  place-items: center;
  position: relative;
}

.post-list {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.post-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 9px;
  cursor: pointer;
  transition: background .12s;
}

.post-row:hover {
  background: var(--surf2);
}

.post-row .pn {
  font-size: 12.5px;
  color: var(--muted);
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.post-lk {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background: var(--surf3);
  display: grid;
  place-items: center;
  color: var(--faint);
  font-size: 9px;
}

.post-row .likes {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
}

/* ── Benchmark ──────────────────────────────────────────────── */
.bench-verdict {
  margin-bottom: 20px;
}

.bench-verdict-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.bench-label {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -.02em;
  line-height: 1;
}

.bench-index {
  font-size: 12px;
  color: var(--muted);
}

.bench-desc {
  font-size: 14px;
  color: #fff;
  line-height: 1.5;
  margin: 0;
}

.bands-wrap {
  margin-bottom: 18px;
}

.bands-track {
  position: relative;
  padding-top: 34px;
}

.band-marker {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  pointer-events: none;
}

.band-marker-tag {
  font-family: var(--font-b);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .03em;
  color: var(--text);
  white-space: nowrap;
}

.band-marker-stem {
  display: block;
  width: 1.5px;
  height: 12px;
  background: var(--text);
}

.band-marker-dot {
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  border: 3px solid var(--bg);
  margin-top: -2px;
}

.bands-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  height: 10px;
  border-radius: 9px;
  overflow: hidden;
}

.band-seg {
  height: 100%;
  background: var(--surf2);
}

.bands-labels {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 5px;
}

.band-lbl {
  font-size: 10.5px;
  color: #fff;
  text-align: center;
  letter-spacing: .04em;
}

.band-lbl.active {
  color: var(--text);
  font-weight: 700;
}

.bench-compare {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 16px;
}

.bc-cell {
  flex: 1;
}

.bc-k {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 3px;
}

.bc-v {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 17px;
}

.bc-sep {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 11px;
  color: var(--faint);
}

/* ── Chart ──────────────────────────────────────────────────── */
.chart {
  position: relative;
}

.chart svg {
  display: block;
  width: 100%;
  cursor: crosshair;
}

.axis-x {
  display: flex;
  justify-content: space-between;
  font-size: 9.5px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 7px;
  letter-spacing: .02em;
}

/* ── Stats row ──────────────────────────────────────────────── */
.statline {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.statline .v {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: clamp(24px, 2.8vw, 34px);
  letter-spacing: -.02em;
  line-height: 1;
  color: var(--accent);
}

.statline .k {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .03em;
}

.statline .d {
  font-size: 13.5px;
  color: #fff;
}

.day-card {
  background: linear-gradient(140deg, var(--accent), color-mix(in oklab, var(--accent) 55%, var(--surf)));
  color: var(--acc-ink);
  justify-content: space-between;
}

.day-card .k {
  color: color-mix(in oklab, var(--acc-ink) 65%, transparent);
}

.day-card .v {
  font-size: 36px;
}

.day-card .d {
  color: color-mix(in oklab, var(--acc-ink) 55%, transparent);
}

/* ── Link rows ──────────────────────────────────────────────── */
.linkrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 28px;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .14s;
}

.linkrow:hover {
  border-color: var(--border-s);
}

.lr-lab {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 0;
}

.lr-lab .t {
  font-size: 13px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 700;
}

.lr-lab .u {
  font-size: 14px;
  font-family: var(--font-d);
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.lr-stat {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
  text-align: right;
  flex-shrink: 0;
}

.linkrow.peak .lr-lab .t {
  color: var(--accent);
}

.linkrow.low .lr-lab .t {
  color: var(--warn);
}

/* ── Feed ───────────────────────────────────────────────────── */
.feed {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-right: 4px;
}

.feed::-webkit-scrollbar {
  width: 6px;
}

.feed::-webkit-scrollbar-thumb {
  background: var(--surf3);
  border-radius: 6px;
}

#feed-card {
  height: 480px;
  display: flex;
  flex-direction: column;
}

#post-deep-dive-viewer {
  height: 480px;
  overflow-y: auto;
}

#post-deep-dive-viewer::-webkit-scrollbar {
  width: 6px;
}

#post-deep-dive-viewer::-webkit-scrollbar-thumb {
  background: var(--surf3);
  border-radius: 6px;
}

.feed-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .13s, border-color .13s;
}

.feed-item:hover {
  background: var(--surf2);
}

.feed-item.active {
  background: var(--surf2);
  border-color: var(--border-s);
}

.feed-rank {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--surf3);
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 12px;
  color: var(--muted);
  flex: none;
}

.feed-item.active .feed-rank {
  background: var(--accent);
  color: var(--acc-ink);
}

.feed-thumb {
  width: 40px;
  height: 40px;
  border-radius: 9px;
  flex: none;
  background: repeating-linear-gradient(135deg,
      var(--surf3), var(--surf3) 5px,
      var(--surf2) 5px, var(--surf2) 10px);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--faint);
}

.feed-body { margin: 0; padding: 0; 
  flex: 1;
  min-width: 0;
}

.feed-body .ttl {
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.feed-body .cap {
  font-size: 11.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.feed-likes {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13px;
  color: var(--neg);
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  flex: none;
}

/* ── Diagnostic ─────────────────────────────────────────────── */
.diag {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.diag-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.diag-title {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 18px;
}

.diag-meta {
  font-size: 11px;
  color: var(--faint);
  margin-top: 3px;
}

.diag-actions {
  display: flex;
  gap: 7px;
}

.caption-box {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--muted);
  max-height: 200px;
  overflow: auto;
  font-style: italic;
}

.caption-box::-webkit-scrollbar {
  width: 6px;
}

.caption-box::-webkit-scrollbar-thumb {
  background: var(--surf3);
  border-radius: 6px;
}

.htag {
  color: var(--accent);
  font-style: normal;
  font-weight: 600;
}

.snapshot {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in oklab, var(--accent) 28%, transparent);
  background: color-mix(in oklab, var(--accent) 8%, var(--surf));
}

.ai-badge {
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.ai-result {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
}

.beam {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 1.8s ease-in-out infinite;
  flex: none;
}

@keyframes pulse {

  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: .4;
    transform: scale(.65);
  }
}

/* ── Hashtag matrix ─────────────────────────────────────────── */
#hashtag-matrix-container {
  max-height: 328px;
  overflow-y: auto;
  padding-right: 6px;
  margin-top: 12px;
}

#hashtag-matrix-container::-webkit-scrollbar {
  width: 6px;
}

#hashtag-matrix-container::-webkit-scrollbar-thumb {
  background: var(--surf3);
  border-radius: 6px;
}

.ht-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 4px;
  border-bottom: 1px solid var(--border);
}

.ht-row:last-child {
  border-bottom: 0;
}

.ht-tag {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 13.5px;
  flex: none;
  width: 186px;
}

.ht-bar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--surf2);
  overflow: hidden;
}

.ht-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: var(--glow);
}

.ht-ratio {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 12px;
  color: var(--muted);
  width: 44px;
  text-align: right;
}

/* ── Quartiles ──────────────────────────────────────────────── */
.quart {
  border-radius: 13px;
  border: 1px solid var(--border);
  padding: 15px;
}

.quart.top {
  background: color-mix(in oklab, var(--pos) 7%, var(--surf));
  border-color: color-mix(in oklab, var(--pos) 20%, transparent);
}

.quart.bot {
  background: color-mix(in oklab, var(--neg) 6%, var(--surf));
  border-color: color-mix(in oklab, var(--neg) 18%, transparent);
}

.quart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.quart-head .lab {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 700;
}

.quart.top .quart-head .lab {
  color: var(--pos);
}

.quart.bot .quart-head .lab {
  color: var(--neg);
}

.quart-head .cnt {
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 11px;
  color: var(--muted);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--surf2);
  border: 1px solid var(--border);
  font-family: var(--font-d);
  font-weight: 600;
  font-size: 12px;
}

.chip .c {
  font-family: var(--font-b);
  font-weight: 700;
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 5px;
}

.chip .c.pos {
  background: color-mix(in oklab, var(--pos) 20%, transparent);
  color: var(--pos);
}

.chip .c.neg {
  background: color-mix(in oklab, var(--neg) 20%, transparent);
  color: var(--neg);
}

/* ── Strategy ───────────────────────────────────────────────── */
.strat-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.strat-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.strat-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
  box-shadow: var(--glow);
}

.strat-item.warn .strat-dot {
  background: var(--warn);
}

.strat-item .txt {
  font-size: 13px;
  line-height: 1.5;
}

.strat-item .txt b {
  font-family: var(--font-d);
}

.kill-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-height: 395px;
  overflow-y: auto;
  padding-right: 4px;
}

.kill-list::-webkit-scrollbar {
  width: 4px;
}

.kill-list::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

.kill-item {
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in oklab, var(--neg) 22%, transparent);
  background: color-mix(in oklab, var(--neg) 5%, var(--surf));
}

.kill-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.kill-top .tag {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 15px;
}

.kill-badge {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--neg);
  border: 1px solid color-mix(in oklab, var(--neg) 38%, transparent);
  border-radius: 6px;
  padding: 2px 7px;
  white-space: nowrap;
}

.kill-desc {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 7px;
  line-height: 1.5;
}

.kill-stats {
  display: flex;
  gap: 16px;
  margin-top: 9px;
}

.kill-stats span {
  font-size: 10.5px;
  color: var(--faint);
}

.kill-stats b {
  font-family: var(--font-d);
  color: var(--text);
  font-weight: 600;
}

/* ── Targets ────────────────────────────────────────────────── */
.target {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surf2);
  cursor: pointer;
  transition: border-color .14s, background .14s;
}

.target:hover {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 7%, var(--surf));
}

.target-l {
  display: flex;
  align-items: center;
  gap: 10px;
}

.target-ico {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--surf3);
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
}

.target-tag {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 14px;
}

.target-vol {
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.target-up {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 14px;
  color: var(--pos);
}

/* ── Competitors ────────────────────────────────────────────── */
.comp-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 13px;
}

.comp-rank {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 11.5px;
  color: var(--acc-ink);
  background: var(--accent);
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex: none;
}

.comp-handle {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 15px;
  flex: 1;
}

.comp-er .v {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 17px;
  color: var(--accent);
}

.comp-er .k {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.comp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 13px;
}

.comp-cell {
  background: var(--surf);
  padding: 10px 12px;
}

.comp-cell .ck {
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.comp-cell .cv {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 14.5px;
  margin-top: 2px;
}

.comp-cell .cv.bad {
  color: var(--neg);
}

.comp-foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.bp {
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
}

.bp.best {
  background: color-mix(in oklab, var(--pos) 8%, var(--surf));
}

.bp.worst {
  background: var(--surf2);
}

.bp .bk {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.bp .bv {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13.5px;
  margin-top: 2px;
}

.bp.best .bv {
  color: var(--pos);
}

/* ── Section heading ────────────────────────────────────────── */
.sec-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 2px 2px;
}

.sec-head .n {
  font-family: var(--font-d);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-ls);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sec-head .n .ic {
  color: var(--accent);
}

.sec-head .line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

.sec-head p {
  margin: 0;
  color: #fff;
  font-size: 15px;
  white-space: nowrap;
}

/* ── Footnote ───────────────────────────────────────────────── */
.foot {
  font-size: 10.5px;
  color: var(--faint);
  margin-top: 11px;
  font-style: italic;
}

/* ── Toast ──────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--accent);
  color: var(--acc-ink);
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13px;
  padding: 10px 20px;
  border-radius: 10px;
  box-shadow: 0 12px 40px -8px rgba(0, 0, 0, .55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 200;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Palette switcher ───────────────────────────────────────── */
.pal-switcher {
  display: flex;
  gap: 6px;
  align-items: center;
}

.pal-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .12s, border-color .12s;
}

.pal-btn:hover {
  transform: scale(1.1);
}

.pal-btn.active {
  border-color: var(--text);
}

@media (prefers-reduced-motion: reduce) {
  .beam {
    animation: none;
  }
}

/* ──────────────────────────────────────────────
   Dynamic State &amp; Component Additions
────────────────────────────────────────────── */
.hidden {
  display: none !important;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--surf3);
  color: var(--text);
  border: 1px solid var(--border-s);
  padding: 12px 20px;
  border-radius: var(--rad);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  transform: translateY(100px);
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  pointer-events: none;
  z-index: 9999;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

/* Error Banner Panel */
.error-panel {
  background: rgba(255, 99, 99, 0.08);
  border: 1px solid rgba(255, 99, 99, 0.2);
  border-radius: var(--rad);
  padding: 16px 20px;
  margin: 10px 0 25px 0;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.error-icon {
  color: var(--neg);
  flex-shrink: 0;
  margin-top: 2px;
}

.error-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.error-title {
  font-family: var(--font-d);
  font-weight: 700;
  color: var(--neg);
  font-size: 14px;
}

.error-text {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}

/* Welcome/Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 40px;
  min-height: 480px;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--rad);
  margin-top: 20px;
}

.empty-state-inner {
  max-width: 500px;
}

.pulse-icon-box {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(198, 255, 58, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  animation: aura-pulse 2s infinite ease-in-out;
}

@keyframes aura-pulse {
  0% {
    transform: scale(0.96);
    box-shadow: 0 0 0 0 rgba(198, 255, 58, 0.2);
  }

  70% {
    transform: scale(1.04);
    box-shadow: 0 0 0 15px rgba(198, 255, 58, 0);
  }

  100% {
    transform: scale(0.96);
    box-shadow: 0 0 0 0 rgba(198, 255, 58, 0);
  }
}

.state-title {
  font-family: var(--font-d);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-ls);
  margin: 0;
}

.state-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
}

/* Loading state screen */
.loader-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 40px;
  min-height: 480px;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--rad);
  margin-top: 20px;
}

.loader-circle-wrapper {
  position: relative;
  width: 128px;
  height: 128px;
  margin-bottom: 28px;
}

.loader-svg {
  width: 128px;
  height: 128px;
}

.track-circle {
  stroke: var(--surf2);
}

.progress-circle {
  stroke: var(--accent);
  transition: stroke-dashoffset 0.15s ease;
}

.loader-percentage-group {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.loader-pct {
  font-family: var(--font-d);
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
}

.loader-text-group {
  max-width: 440px;
}

.loader-status {
  font-family: var(--font-d);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text);
}

.loader-subtext {
  font-size: 13px;
  color: var(--muted);
}

/* Competitor Dynamic Styles */
.competitor-title-row {
  margin-top: 40px;
  margin-bottom: 20px;
}

.competitor-section-title {
  font-family: var(--font-d);
  font-size: 24px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
}

.competitor-subtitle {
  font-size: 14px;
  color: var(--muted);
  margin: 0;
}

.competitor-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--gap);
}

.competitor-card {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--rad);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.competitor-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.comp-rank-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.comp-rank-badge {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 11px;
  background: var(--surf2);
  color: var(--accent);
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.comp-username {
  font-size: 14px;
  font-weight: 700;
}

.comp-link {
  color: var(--muted);
  transition: color 0.14s;
  display: flex;
  align-items: center;
}

.comp-link:hover {
  color: var(--accent);
}

.comp-er-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.comp-er-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

.comp-er-val {
  font-family: var(--font-d);
  font-weight: 600;
  color: var(--accent);
}

.comp-bar-track {
  height: 6px;
  background: var(--surf2);
  border-radius: 3px;
  overflow: hidden;
}

.comp-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
}

.comp-stats-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.comp-stat-box {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.comp-stat-box-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.comp-stat-box-val {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 14px;
}

.comp-ghost-box {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.comp-ghost-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}

.comp-ghost-val {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 13px;
  color: var(--neg);
}

.comp-highlights {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.comp-highlight-title {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.comp-highlight-btn {
  display: block;
  text-align: center;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 4px;
  font-family: var(--font-d);
  font-weight: 700;
  font-size: 12px;
  transition: background 0.14s, border-color 0.14s;
}

.comp-highlight-btn:hover {
  background: var(--surf3);
  border-color: var(--border-s);
}

.comp-highlight-btn.best {
  color: var(--pos);
}

.comp-highlight-btn.worst {
  color: var(--neg);
}

.post-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px;
  color: var(--muted);
  margin-left: 6px;
  vertical-align: middle;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}

.post-row:hover .post-link-btn {
  background: var(--surf3);
  color: var(--accent);
  border-color: var(--border-s);
}


.main-title {
  font-family: var(--font-d);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-ls);
  margin: 0;
}

/* ════════════════ MOBILE RESPONSIVENESS AND DRAWERS ════════════════ */
.sidebar-toggle {
  display: none !important;
}

@media (max-width: 1080px) {
  .app {
    grid-template-columns: 1fr !important;
  }

  .sidebar {
    position: fixed !important;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100vh;
    z-index: 9999 !important;
    background: var(--bg);
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-right: 1px solid var(--border);
  }

  .sidebar.active {
    left: 0 !important;
  }

  .sidebar-toggle {
    display: inline-flex !important;
    background: var(--surf2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    margin-right: 8px;
  }

  .sidebar-toggle:hover {
    background: var(--surf3);
  }

  .main {
    padding: 16px !important;
  }

  /* Form responsive adjustments */
  #search-form {
    flex-direction: column !important;
    align-items: stretch !important;
    width: 100% !important;
    gap: 12px !important;
  }

  #search-form&gt;div {
    flex-wrap: wrap !important;
    width: 100% !important;
    justify-content: space-between;
  }

  #search-form input[type=&quot;date&quot;] {
    flex: 1 !important;
    min-width: 110px !important;
  }

  .url-field {
    width: 100% !important;
    flex: none !important;
  }

  .btn-cta {
    width: 100% !important;
    margin-top: 4px;
    height: 44px;
  }

  /* Topbar stacking */
  .tb-inner {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 16px !important;
  }
}

/* Responsive Table Wrapper */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: var(--gap);
}

.table-responsive table {
  white-space: nowrap;
}

@media (max-width: 480px) {
  :root {
    --gap: 12px;
  }

  .card {
    padding: 14px !important;
  }

  .state-title {
  font-family: var(--font-d);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-ls);
  margin: 0;
}

  canvas {
    max-height: 240px !important;
  }
}

/* ── Mobile patch: profile strip + fixed-height feeds ── */
@media (max-width: 1080px) {
  .profile-strip {
    flex-direction: column;
    align-items: stretch;
  }

  .ps-spacer {
    display: none;
  }

  .stat-box-row {
    grid-template-columns: 1fr 1fr;
  }
}

/* ── Mobile patch: profile strip + fixed-height feeds ── */
@media (max-width: 1080px) {
  .profile-strip {
    flex-direction: column;
    align-items: stretch;
  }

  .ps-spacer {
    display: none;
  }

  .stat-box-row {
    grid-template-columns: 1fr 1fr;
  }
}

/* ── Print / PDF Styles ─────────────────────────────────────── */
.print-header { display: none; }

@media print {
  :root, html, body { margin: 0; padding: 0; 
    --bg: #FFFFFF !important;
    --bg2: #F5F6F8 !important;
    --surf: #FFFFFF !important;
    --surf2: #F4F5F8 !important;
    --surf3: #ECEEF2 !important;
    --border: rgba(15, 17, 26, .10) !important;
    --border-s: rgba(15, 17, 26, .18) !important;
    --text: #13141A !important;
    --muted: #5E6472 !important;
    --faint: #9AA0AE !important;
    --accent: #16161C !important;
    background: #FFFFFF !important;
    color: #13141A !important;
  }
  
  .sidebar, .topbar, #search-form, .post-link-btn, .btn, #error-panel {
    display: none !important;
  }
  
  .app {
    display: block !important;
    grid-template-columns: 1fr !important;
  }

  .main {
    width: 100% !important;
  }

  .content {
    padding: 0 !important;
    margin: 0 !important;
  }

  .print-header {
    display: block !important;
    text-align: center;
    margin-bottom: 20px;
    padding-top: 20px;
  }

  /* Prevent page breaks inside cards */
  .card, .b-card, .metric, .col-box {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .grid, .metrics-grid {
    gap: 12px !important;
  }
}

&lt;script&gt;
// CONFIGURATION Constants
const BACKEND_URL = (function() {
  if (window.location.hostname === &quot;localhost&quot; || window.location.hostname === &quot;127.0.0.1&quot; || window.location.protocol === &quot;file:&quot;) {
    return &quot;http://127.0.0.1:8000&quot;;
  }
  try {
    const parentHost = window.parent.location.hostname;
    const parentProtocol = window.parent.location.protocol;
    if (parentHost === &quot;localhost&quot; || parentHost === &quot;127.0.0.1&quot; || parentProtocol === &quot;file:&quot;) {
      return &quot;http://127.0.0.1:8000&quot;;
    }
  } catch (e) {
    // Ignore cross-origin errors
  }
  return &quot;https://client-audit-tool.onrender.com&quot;;
})();
const SVG_CIRCUMFERENCE = 314.159; // 2 * Math.PI * 50

// APP STATE
function resolvePostUrl(post) {
  if (!post) return '#';
  const sc = post.shortcode || post.shortCode || post.code || '';
  if (sc && typeof sc === 'string' && sc.trim() && sc.trim().length > 3) {
    return 'https://www.instagram.com/p/' + sc.trim() + '/';
  }
  const candidates = [post.post_url, post.url, post.link, post.instagram_url];
  for (const c of candidates) {
    if (c && typeof c === 'string' && c.trim() && c.trim().toLowerCase() !== 'nan') {
      const trimmed = c.trim();
      if (trimmed.includes('/p/') || trimmed.includes('/reel/') || trimmed.includes('/tv/')) {
        return trimmed.startsWith('http') ? trimmed : 'https://www.instagram.com' + (trimmed.startsWith('/') ? '' : '/') + trimmed;
      }
    }
  }
  for (const c of candidates) {
    if (c && typeof c === 'string' && c.trim() && c.trim().startsWith('http')) {
      return c.trim();
    }
  }
  return '#';
}

function fmtTrendDate(d) {
  // Convert YYYY-MM-DD to DD/MM/YYYY format
  if (!d) return &quot;Default 15 posts audit&quot;;
  try {
    const parts = d.split(&#x27;-&#x27;);
    if (parts.length === 3) {
      const dt = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      return dt.toLocaleDateString(&#x27;en-GB&#x27;, { day: &#x27;2-digit&#x27;, month: &#x27;2-digit&#x27;, year: &#x27;numeric&#x27; });
    }
  } catch(e) {}
  return d;
}

async function fetchDynamicThumbnail(post, imgElement) {
  if (!post || !imgElement) return;
  
  const baseUrl = typeof BACKEND_URL !== &#x27;undefined&#x27; ? BACKEND_URL : &#x27;http://127.0.0.1:8000&#x27;;
  const postUrl = resolvePostUrl(post);
  
  // If we have a real display_url (not picsum, not empty), proxy it with the post_url as fallback
  if (post.display_url &amp;&amp; post.display_url.trim() &amp;&amp; !post.display_url.includes(&#x27;picsum.photos&#x27;)) {
    imgElement.src = baseUrl + `/api/proxy-image?url=${encodeURIComponent(post.display_url)}&amp;post_url=${encodeURIComponent(postUrl)}`;
    return;
  }
  
  // If no display_url but we have a valid Instagram post URL, try to fetch thumbnail via proxy og:image
  if (postUrl &amp;&amp; postUrl !== &#x27;#&#x27; &amp;&amp; (postUrl.includes(&#x27;/p/&#x27;) || postUrl.includes(&#x27;/reel/&#x27;) || postUrl.includes(&#x27;/tv/&#x27;))) {
    imgElement.src = baseUrl + `/api/proxy-image?url=${encodeURIComponent(postUrl)}&amp;post_url=${encodeURIComponent(postUrl)}`;
    return;
  }
  
  // Final fallback: branded placeholder based on post index
  const seed = post.shortcode || post.index || post.post_id || &#x27;default&#x27;;
  imgElement.src = `https://picsum.photos/seed/${encodeURIComponent(seed)}/100/100`;
}

let state = {
  loading: false,
  progress: 0,
  progressInterval: null,
  activeProfile: &#x27;&#x27;,
  selectedReel: null,
  selectedStatic: null
};

// SELECT DOM ELEMENTS
const searchForm = document.getElementById(&#x27;search-form&#x27;);
const profileUrlInput = document.getElementById(&#x27;profile-url&#x27;);
const submitBtn = document.getElementById(&#x27;submit-btn&#x27;);
const emptyState = document.getElementById(&#x27;empty-state&#x27;);
const loaderState = document.getElementById(&#x27;loader-state&#x27;);
const dashboardState = document.getElementById(&#x27;dashboard-state&#x27;);
const errorPanel = document.getElementById(&#x27;error-panel&#x27;);
const errorMessage = document.getElementById(&#x27;error-message&#x27;);

const progressCircle = document.getElementById(&#x27;progress-circle&#x27;);
const loaderPct = document.getElementById(&#x27;loader-pct&#x27;);
const loaderStatus = document.getElementById(&#x27;loader-status&#x27;);

const historyListContainer = document.getElementById(&#x27;history-list&#x27;);

// INITIALIZE APP
document.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
  init();
});

function init() {
  // Set initial circular loader offset
  if (progressCircle) {
    progressCircle.style.strokeDashoffset = SVG_CIRCUMFERENCE;
  }

  // Load audit history list
  loadHistory();

  // Attach search form submit listener
  if (searchForm) {
    searchForm.addEventListener(&#x27;submit&#x27;, handleSearchSubmit);
  }

  // Mobile sidebar toggle handler
  const toggleBtn = document.getElementById(&#x27;sidebar-toggle&#x27;);
  const sidebar = document.querySelector(&#x27;.sidebar&#x27;);
  if (toggleBtn &amp;&amp; sidebar) {
    toggleBtn.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      e.stopPropagation();
      sidebar.classList.toggle(&#x27;active&#x27;);
    });
    // Close sidebar when clicking outside on mobile
    document.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (sidebar.classList.contains(&#x27;active&#x27;) &amp;&amp; !sidebar.contains(e.target) &amp;&amp; e.target !== toggleBtn) {
        sidebar.classList.remove(&#x27;active&#x27;);
      }
    });
  }
}

// ─── API HISTORY LIST FETCHER ───
async function loadHistory() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/history-list`);
    if (!res.ok) throw new Error(&#x27;Failed to fetch history list&#x27;);
    const list = await res.json();

    if (list &amp;&amp; list.length &gt; 0) {
      historyListContainer.innerHTML = &#x27;&#x27;;
      list.forEach(item =&gt; {
        const initials = item.username.substring(0, 2).toUpperCase();
        const followersFormatted = item.total_followers &gt;= 1000000
          ? `${(item.total_followers / 1000000).toFixed(1)}M`
          : item.total_followers &gt;= 1000
            ? `${(item.total_followers / 1000).toFixed(1)}k`
            : item.total_followers;

        // Calculate status direction class
        const erVal = parseFloat(item.engagement_rate) || 0;
        let directionClass = &#x27;mid&#x27;;
        if (erVal &gt; 3.5) directionClass = &#x27;up&#x27;;
        else if (erVal &lt; 2.0) directionClass = &#x27;dn&#x27;;

        let timeStr = &#x27;Unknown Time&#x27;;
        if (item.audited_at) {
          try {
            const d = new Date(item.audited_at);
            timeStr = d.toLocaleString(&#x27;en-US&#x27;, {
              month: &#x27;short&#x27;, day: &#x27;numeric&#x27;,
              hour: &#x27;numeric&#x27;, minute: &#x27;2-digit&#x27;, hour12: true
            });
          } catch(e) {}
        }

        const div = document.createElement(&#x27;div&#x27;);
        div.className = &#x27;acct&#x27;;
        if (state.activeProfile.includes(item.username)) {
          div.className = &#x27;acct active&#x27;;
        }
        div.onclick = () =&gt; handleHistoryClick(item.username);
        div.innerHTML = `
          &lt;div class=&quot;av&quot;&gt;${initials}&lt;/div&gt;
          &lt;div class=&quot;acct-meta&quot;&gt;
            &lt;div class=&quot;h&quot;&gt;@${item.username}&lt;/div&gt;
            &lt;div class=&quot;s&quot; style=&quot;display:flex; justify-content:space-between; width:100%; gap:8px;&quot;&gt;
              &lt;span style=&quot;color:#ffffff; font-size:11.5px; font-weight:600;&quot;&gt;${followersFormatted} followers&lt;/span&gt;
              &lt;span style=&quot;color:#ffffff; font-size:11.5px; font-weight:600;&quot;&gt;${timeStr}&lt;/span&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;er ${directionClass}&quot;&gt;${item.engagement_rate}%&lt;/div&gt;
        `;
        historyListContainer.appendChild(div);
      });
    } else {
      historyListContainer.innerHTML = `
        &lt;div style=&quot;font-size:11px;color:var(--faint);text-align:center;padding:20px 10px;&quot;&gt;
          No recent audits found
        &lt;/div&gt;
      `;
    }
  } catch (err) {

    historyListContainer.innerHTML = `
      &lt;div style=&quot;font-size:11px;color:var(--neg);text-align:center;padding:20px 10px;&quot;&gt;

}

// ─── HISTORY CLICK HANDLER ───
async function handleHistoryClick(username) {
  if (state.loading) return;
  setLoadingState(true);
  startProgress();
  hideError();

  try {
    const res = await fetch(`${BACKEND_URL}/api/history/${encodeURIComponent(username)}/data`);
    if (!res.ok) {
      if (res.status === 404) {
        const auditRes = await fetch(`${BACKEND_URL}/api/dashboard-audit?target_username=${encodeURIComponent(username)}`);
        if (!auditRes.ok) throw new Error(`Snapshot fetch failed with code ${auditRes.status}`);
        const data = await auditRes.json();
        await finishProgress();
        await new Promise(resolve => setTimeout(resolve, 600));
        displayDashboard(data);
        return;
      }
      throw new Error(`Snapshot fetch failed with code ${res.status}`);
    }
    const data = await res.json();

    await finishProgress();
    await new Promise(resolve =&gt; setTimeout(resolve, 600));

    displayDashboard(data);
  } catch (err) {
    console.error(err);
    if (err.message === &quot;Failed to fetch&quot; || err.message.includes(&quot;NetworkError&quot;)) {
      showError(`Network Error: Cannot reach the backend server. Please ensure the backend is running. (Failed to load @${username})`);
    } else {
      showError(`Failed to load snapshot for @${username}. ${err.message}`);
    }
  } finally {
    setLoadingState(false);
  }
}

// ─── SEARCH SUBMIT HANDLER ───
async function handleSearchSubmit(e) {
  e.preventDefault();
  const profileUrl = profileUrlInput.value.trim();
  if (!profileUrl || state.loading) return;

  setLoadingState(true);
  startProgress();
  hideError();

  try {
    const encodedUrl = encodeURIComponent(profileUrl);
    const dateFrom = document.getElementById(&#x27;date-from&#x27;)?.value;
    const dateTo = document.getElementById(&#x27;date-to&#x27;)?.value;
    
    let apiUrl = `${BACKEND_URL}/api/dashboard-audit?profile_url=${encodedUrl}`;
    if (dateFrom) apiUrl += `&amp;date_from=${encodeURIComponent(dateFrom)}`;
    if (dateTo) apiUrl += `&amp;date_to=${encodeURIComponent(dateTo)}`;

    const response = await fetch(apiUrl);
    if (!response.ok) {
      throw new Error(`Server error: code ${response.status}`);
    }

    const initData = await response.json();
    const jobId = initData.job_id;

    let resData = null;
    while (true) {
      await new Promise(resolve =&gt; setTimeout(resolve, 3000));
      const statusRes = await fetch(`${BACKEND_URL}/api/audit-status/${jobId}`);
      if (!statusRes.ok) throw new Error(&quot;Failed to check status&quot;);
      const statusData = await statusRes.json();

      if (statusData.status === &quot;completed&quot;) {
        await finishProgress();
        await new Promise(resolve =&gt; setTimeout(resolve, 600));
        resData = statusData.data;
        break;
      } else if (statusData.status === &quot;error&quot;) {
        throw new Error(statusData.error || &quot;Background audit process failed&quot;);
      }
    }

    displayDashboard(resData);
    loadHistory(); // Refresh history list
  } catch (err) {
    console.error(err);
    if (err.message === &quot;Failed to fetch&quot; || err.message.includes(&quot;NetworkError&quot;)) {
      showError(`Network Error: Cannot reach the backend server. Please ensure the backend is running.`);
    } else {
      showError(err.message);
    }
  } finally {
    setLoadingState(false);
  }
}

// ─── LOADING STATE CONTROLLERS ───
function setLoadingState(isLoading) {
  state.loading = isLoading;
  if (submitBtn) {
    submitBtn.disabled = isLoading;
    submitBtn.style.opacity = isLoading ? &#x27;0.7&#x27; : &#x27;&#x27;;
    submitBtn.textContent = isLoading ? &#x27;Checking…&#x27; : &#x27;Check This Account&#x27;;
  }
  if (profileUrlInput) profileUrlInput.disabled = isLoading;

  if (isLoading) {
    if (emptyState) emptyState.classList.add(&#x27;hidden&#x27;);
    if (dashboardState) dashboardState.classList.add(&#x27;hidden&#x27;);
    if (loaderState) loaderState.classList.remove(&#x27;hidden&#x27;);
  } else {
    if (loaderState) loaderState.classList.add(&#x27;hidden&#x27;);
  }
}

// ─── PROGRESS ANIMATION MOTORS ───
function startProgress() {
  state.progress = 0;
  updateProgressCircle(0);

  if (state.progressInterval) {
    clearInterval(state.progressInterval);
  }

  state.progressInterval = setInterval(() =&gt; {
    state.progress += Math.max(1, Math.floor(Math.random() * 3));
    if (state.progress &gt;= 98) {
      state.progress = 98;
      clearInterval(state.progressInterval);
    }
    updateProgressCircle(state.progress);
  }, 150);
}

function finishProgress() {
  return new Promise((resolve) =&gt; {
    if (state.progressInterval) {
      clearInterval(state.progressInterval);
    }

    const finishInterval = setInterval(() =&gt; {
      state.progress += Math.floor(Math.random() * 3) + 2;
      if (state.progress &gt;= 100) {
        state.progress = 100;
        clearInterval(finishInterval);
        resolve();
      }
      updateProgressCircle(state.progress);
    }, 20);
  });
}

function updateProgressCircle(val) {
  // Update progress stroke ring
  const offset = SVG_CIRCUMFERENCE - (val / 100) * SVG_CIRCUMFERENCE;
  if (progressCircle) {
    progressCircle.style.strokeDashoffset = offset;
  }

  // Update percentage text
  if (loaderPct) {
    loaderPct.textContent = `${val}%`;
  }

  // Update loader stage status messages
  if (loaderStatus) {
    if (val &lt; 25) {
      loaderStatus.textContent = &quot;Connecting to secure Instagram API...&quot;;
    } else if (val &gt;= 25 &amp;&amp; val &lt; 50) {
      loaderStatus.textContent = &quot;Ingesting profile metadata &amp; post statistics...&quot;;
    } else if (val &gt;= 50 &amp;&amp; val &lt; 75) {
      loaderStatus.textContent = &quot;Running hashtag classification algorithms...&quot;;
    } else if (val &gt;= 75 &amp;&amp; val &lt; 95) {
      loaderStatus.textContent = &quot;Analyzing direct competitor metrics...&quot;;
    } else {
      loaderStatus.textContent = &quot;Compiling final diagnostic audit dashboard...&quot;;
    }
  }
}

// ─── ERROR HANDLING ───
function showError(msg) {
  if (errorMessage &amp;&amp; errorPanel) {
    errorMessage.textContent = msg;
    errorPanel.classList.remove(&#x27;hidden&#x27;);
  }
}

// Global dismiss/hide error
window.hideError = function () {
  if (errorPanel) {
    errorPanel.classList.add(&#x27;hidden&#x27;);
  }
}

function hideError() {
  if (errorPanel) {
    errorPanel.classList.add(&#x27;hidden&#x27;);
  }
}

// ─── DASHBOARD RENDERING ENGINE ───
function displayDashboard(rawData) {
  const data = rawData.client_metrics ? rawData.client_metrics : rawData;
  const competitorData = rawData.competitor_metrics || [];
  const clientStats = data.calculated_metrics || {};

  state.activeProfile = data.profile_url || profileUrlInput.value.trim();
  state.selectedPost = null; // Reset selection on new load

  // Hide placeholder/loader and show dashboard wrapper
  if (emptyState) emptyState.classList.add(&#x27;hidden&#x27;);

  if (dashboardState) dashboardState.classList.remove(&#x27;hidden&#x27;);

  // 1. Ingest Hero Meta Panel
  const handle = getProfileHandle(state.activeProfile);

  // Update browser document title
  document.title = `Instagram Audit — BloomX · ${handle}`;

  const handleElements = document.querySelectorAll(&#x27;#profile-handle&#x27;);
  handleElements.forEach(el =&gt; {
    el.textContent = handle;
  });

  const initialsElement = document.getElementById(&#x27;profile-initials&#x27;);
  if (initialsElement) {
    initialsElement.textContent = handle.substring(1, 3).toUpperCase();
  }

  const linkElement = document.getElementById(&#x27;profile-link&#x27;);
  if (linkElement) {
    linkElement.href = state.activeProfile;
  }

  const postsCount = data.posts?.length || 0;
  const statPostsCountEl = document.getElementById(&#x27;stat-posts-count&#x27;);
  if (statPostsCountEl) {
    statPostsCountEl.textContent = postsCount;
  }

  const totalLikes = postsCount &gt; 0 ? data.posts.reduce((sum, p) =&gt; sum + (p.likes || 0), 0) : 0;
  const statTotalLikesEl = document.getElementById(&#x27;stat-total-likes&#x27;);
  if (statTotalLikesEl) {
    statTotalLikesEl.dataset.val = totalLikes;
    statTotalLikesEl.textContent = totalLikes.toLocaleString();
  }

  const totalComments = postsCount &gt; 0 ? data.posts.reduce((sum, p) =&gt; sum + (p.comments || 0), 0) : 0;
  const statTotalCommentsEl = document.getElementById(&#x27;stat-total-comments&#x27;);
  if (statTotalCommentsEl) {
    statTotalCommentsEl.dataset.val = totalComments;
    statTotalCommentsEl.textContent = totalComments.toLocaleString();
  }

  const followersVal = data.follower_count || clientStats.total_followers || 0;
  const statTotalFollowersEl = document.getElementById(&#x27;stat-total-followers&#x27;);
  if (statTotalFollowersEl) {
    const followersFormatted = followersVal &gt;= 1000000 
      ? (followersVal / 1000000).toFixed(1).replace(/\.0$/, &#x27;&#x27;) + &#x27;M&#x27; 
      : followersVal &gt;= 1000 
        ? (followersVal / 1000).toFixed(1).replace(/\.0$/, &#x27;&#x27;) + &#x27;k&#x27; 
        : String(followersVal);
    statTotalFollowersEl.dataset.val = followersFormatted;
    statTotalFollowersEl.textContent = followersFormatted;
  }

  // 2. Ingest KPI Cards
  const erVal = clientStats.engagement_rate || 0;
  const erEl = document.getElementById(&#x27;kpi-er&#x27;);
  if (erEl) {
    erEl.dataset.val = erVal;
    erEl.textContent = erVal;

    // Dynamically adjust first KPI card colors (good/warn/neg)
    const erCard = document.getElementById(&#x27;kpi-er-card&#x27;);
    if (erCard) {
      erCard.className = &#x27;card metric &#x27; + (erVal &gt;= 3.5 ? &#x27;good&#x27; : erVal &gt;= 2.0 ? &#x27;warnv&#x27; : &#x27;neg&#x27;);
    }
  }

  const inactiveVal = clientStats.inactive_follower_percentage || 0;
  const inactiveEl = document.getElementById(&#x27;kpi-inactive&#x27;);
  if (inactiveEl) {
    inactiveEl.dataset.val = inactiveVal;
    inactiveEl.textContent = inactiveVal;

    const inactiveCard = document.getElementById(&#x27;kpi-inactive-card&#x27;);
    if (inactiveCard) {
      inactiveCard.className = &#x27;card metric &#x27; + (inactiveVal &lt;= 10 ? &#x27;pos&#x27; : inactiveVal &lt;= 25 ? &#x27;warnv&#x27; : &#x27;good&#x27;);
    }
  }

  const authenticityScore = clientStats.audience_authenticity_score ?? (100 - inactiveVal);
  const authenticityScoreRounded = Math.round(authenticityScore * 10) / 10;
  const authEl = document.getElementById(&#x27;kpi-authenticity&#x27;);
  if (authEl) {
    authEl.dataset.val = authenticityScoreRounded;
    authEl.textContent = authenticityScoreRounded;

    const authCard = document.getElementById(&#x27;kpi-authenticity-card&#x27;);
    if (authCard) {
      authCard.className = &#x27;card metric &#x27; + (authenticityScoreRounded &gt;= 80 ? &#x27;pos&#x27; : authenticityScoreRounded &gt;= 60 ? &#x27;warnv&#x27; : &#x27;good&#x27;);
    }
  }

  // Convert days_per_post into posts_per_day, calculating dynamically to protect against old cache payloads
  let velocityVal = 0;
  const postsList = data.posts || [];
  
  if (postsList.length &gt; 1) {
    const dates = postsList
      .filter(p =&gt; !p.is_mock)
      .map(p =&gt; new Date(p.timestamp || p.date))
      .filter(d =&gt; !isNaN(d.getTime()))
      .sort((a, b) =&gt; b - a); // descending

    if (dates.length &gt; 1) {
      // Calculate true calendar days spanned (stripping out time of day)
      const oldestDate = new Date(dates[dates.length - 1]);
      oldestDate.setHours(0, 0, 0, 0);
      
      const newestDate = new Date(dates[0]);
      newestDate.setHours(0, 0, 0, 0);
      
      const exactDaysDifference = Math.round((newestDate - oldestDate) / (1000 * 60 * 60 * 24));
      const calendarDays = Math.max(exactDaysDifference + 1, 1);
      
      velocityVal = dates.length / calendarDays;
    }
  } else if (clientStats.days_per_post &amp;&amp; clientStats.days_per_post &gt; 0) {
    velocityVal = 1 / clientStats.days_per_post;
  }

  // Format nicely (e.g. 0.3 if low, or whole numbers)
  const formattedVelocity = velocityVal &lt; 0.1 &amp;&amp; velocityVal &gt; 0 
    ? velocityVal.toFixed(2) 
    : velocityVal.toFixed(1);

  const velocityEl = document.getElementById(&#x27;kpi-velocity&#x27;);
  if (velocityEl) {
    velocityEl.dataset.val = formattedVelocity;
    velocityEl.textContent = formattedVelocity;
  }

  // 3. Render SVG Charts
  renderAllDynamicCharts(rawData);

  // 4. Render Format Performance Battle
  renderFormatPerformanceBattle(data);

  // 5. Render Niche Benchmark
  renderNicheBenchmark(data);

  // 6. Render Median Metrics and Best/Worst posts
  renderMedianMetricsAndBestWorst(data);

  // 6b. Render Best Reel and Best Static Post
  renderBestByType(data);

  // 7. Render Two-Column Post Feed and Diagnostic Viewer
  renderPostsFeedAndDeepDive(data);

  // 8. Ingest Hashtag Strategy
  const hashtagIntelligence = processHashtagIntelligence(data);

  // Render AI suggestions
  const aiMarkdownEl = document.getElementById(&#x27;hashtag-ai-markdown&#x27;);
  if (aiMarkdownEl) {
    const aiTextHtml = parseMarkdown(data.hashtags_analysis?.ai_assessment || data.ai_assessment || &#x27;No AI assessment available.&#x27;);
    aiMarkdownEl.innerHTML = aiTextHtml;
  }

  // Bind copy strategy text
  const aiStrategyText = data.hashtags_analysis?.ai_assessment || data.ai_assessment || &#x27;&#x27;;
  const copyBtn = document.getElementById(&#x27;copy-strategy-btn&#x27;);
  if (copyBtn) {
    copyBtn.onclick = () =&gt; {
      if (!aiStrategyText) return;

  // Populate Matrix Table List
  const matrixContainer = document.getElementById(&#x27;hashtag-matrix-container&#x27;);
  if (matrixContainer) {
    if (hashtagIntelligence.hashtagMatrix.length === 0) {
      matrixContainer.innerHTML = `&lt;div style=&quot;font-size:11px;color:var(--faint);text-align:center;padding:20px 10px;&quot;&gt;No tags found&lt;/div&gt;`;
    } else {
      matrixContainer.innerHTML = hashtagIntelligence.hashtagMatrix.map(item =&gt; `
        &lt;div class=&quot;ht-row&quot;&gt;
          &lt;span class=&quot;ht-tag&quot; onclick=&quot;clip(&#x27;${item.tag}&#x27;, &#x27;${item.tag}&#x27;)&quot;&gt;${item.tag}&lt;/span&gt;
          &lt;span class=&quot;ht-bar&quot;&gt;&lt;i style=&quot;width:${item.frequency_pct}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;
          &lt;span class=&quot;ht-ratio&quot;&gt;${item.usage_ratio}&lt;/span&gt;

      `).join(&#x27;&#x27;);
    }
  }

  // Update Engagement performance labels
  const q75Label = document.getElementById(&#x27;q75-label&#x27;);
  const q75Count = document.getElementById(&#x27;q75-count&#x27;);
  const q25Label = document.getElementById(&#x27;q25-label&#x27;);
  const q25Count = document.getElementById(&#x27;q25-count&#x27;);

  if (q75Label) q75Label.textContent = `Best performers · avg ${Math.round(hashtagIntelligence.analyticsData.q75_threshold || 0).toLocaleString()} likes`;
  if (q75Count) q75Count.textContent = `${hashtagIntelligence.analyticsData.high_engagement_tags.length} tags`;
  if (q25Label) q25Label.textContent = `Weakest performers · avg ${Math.round(hashtagIntelligence.analyticsData.q25_threshold || 0).toLocaleString()} likes`;
  if (q25Count) q25Count.textContent = `${hashtagIntelligence.analyticsData.low_engagement_tags.length} tags`;

  // Populate Quartile Lists (Chips)
  const highList = document.getElementById(&#x27;high-engagement-tags-list&#x27;);
  if (highList) {
    if (hashtagIntelligence.analyticsData.high_engagement_tags.length === 0) {
      highList.innerHTML = `&lt;span style=&quot;font-size:11px; color:var(--faint); font-style:italic;&quot;&gt;No top tags&lt;/span&gt;`;
    } else {
      highList.innerHTML = hashtagIntelligence.analyticsData.high_engagement_tags.map(item =&gt; `
        &lt;span class=&quot;chip&quot; onclick=&quot;clip(&#x27;${item.tag}&#x27;, &#x27;${item.tag}&#x27;)&quot;&gt;${item.tag} &lt;span class=&quot;c pos&quot;&gt;★ ${item.top_posts_ratio}&lt;/span&gt;&lt;/span&gt;

  // Populate Kill List
  const killContainer = document.getElementById(&#x27;kill-list-container&#x27;);
  if (killContainer) {
    const killList = hashtagIntelligence.analyticsData.kill_list || [];
    if (killList.length === 0) {
      killContainer.innerHTML = `&lt;div style=&quot;font-size:11px;color:var(--faint);text-align:center;padding:20px 10px;&quot;&gt;No critical warnings&lt;/div&gt;`;
    } else {

  // Trigger metric countUp animations for all active .cu elements
  document.querySelectorAll(&#x27;.cu&#x27;).forEach(countUp);

// ─── CHARTS DRAWING ENGINE ───
function renderAllDynamicCharts(rawData) {
  const data = rawData.client_metrics ? rawData.client_metrics : rawData;
  const trendHistory = rawData.trend_history || [];
  const reelsViews = rawData.reels_views_distribution || data.reels_views_distribution || [];
  const reachDistribution = rawData.reach_distribution_data || data.reach_distribution_data || [];

  // --- Chart 1: Audience Growth Timeline ---

  const recentTrend = trendHistory.slice(-6);
  const trendPts = recentTrend.length &gt;= 2 ? recentTrend.map(item =&gt; item.follower_count) : [40, 42, 41, 45, 47, 46, 49, 52, 54, 57, 59, 63];
  const trendLabels = recentTrend.length &gt;= 2 ? recentTrend.map(item =&gt; fmtTrendDate(item.date)) : [&quot;Jan&quot;, &quot;Feb&quot;, &quot;Mar&quot;, &quot;Apr&quot;, &quot;May&quot;, &quot;Jun&quot;, &quot;Jul&quot;, &quot;Aug&quot;, &quot;Sep&quot;, &quot;Oct&quot;, &quot;Nov&quot;, &quot;Dec&quot;];
  drawChart(&#x27;chart-growth&#x27;, trendPts, &#x27;var(--accent)&#x27;, 148, trendLabels);

  // Update growth dates axis-x (bottom labels below chart)
  const growthAxis = document.getElementById(&#x27;growth-axis-x&#x27;);
  if (growthAxis &amp;&amp; recentTrend.length &gt;= 2) {
    growthAxis.innerHTML = &#x27;&#x27;;
    recentTrend.forEach(item =&gt; {
      const span = document.createElement(&#x27;span&#x27;);
      span.textContent = fmtTrendDate(item.date);
      growthAxis.appendChild(span);
    });
  }

  // --- Chart 2: Reels Views Distribution ---
  const reelsPts = reelsViews.length &gt; 0 ? reelsViews.map(item =&gt; item.views) : [0, 0, 0, 0];
  const reelsLabels = reelsViews.length &gt; 0 ? reelsViews.map(item =&gt; item.date) : [&quot;Wk 1&quot;, &quot;Wk 2&quot;, &quot;Wk 3&quot;, &quot;Wk 4&quot;];
  drawChart(&#x27;chart-reels&#x27;, reelsPts, &#x27;var(--acc2)&#x27;, 148, reelsLabels);

  const reelsAxis = document.getElementById(&#x27;reels-axis-x&#x27;);
  if (reelsAxis &amp;&amp; reelsViews.length &gt; 0) {
    reelsAxis.innerHTML = &#x27;&#x27;;
    const step = Math.max(1, Math.floor(reelsViews.length / 5));
    for (let i = 0; i &lt; reelsViews.length; i += step) {
      const span = document.createElement(&#x27;span&#x27;);
      span.textContent = reelsViews[i].date;
      reelsAxis.appendChild(span);
    }
  }

  // --- Chart 3: Reach Performance Distribution ---
  const reachPts = reachDistribution.length &gt; 0 ? reachDistribution.map(item =&gt; item.views) : [0, 0, 0, 0];
  const reachLabels = reachDistribution.length &gt; 0 ? reachDistribution.map(item =&gt; item.date) : [&quot;Wk 1&quot;, &quot;Wk 2&quot;, &quot;Wk 3&quot;, &quot;Wk 4&quot;];
  drawChart(&#x27;chart-reach&#x27;, reachPts, &#x27;var(--acc2)&#x27;, 148, reachLabels);

  const reachAxis = document.getElementById(&#x27;reach-axis-x&#x27;);
  if (reachAxis &amp;&amp; reachDistribution.length &gt; 0) {
    reachAxis.innerHTML = &#x27;&#x27;;
    const step = Math.max(1, Math.floor(reachDistribution.length / 5));
    for (let i = 0; i &lt; reachDistribution.length; i += step) {
      const span = document.createElement(&#x27;span&#x27;);
      span.textContent = reachDistribution[i].date;
      reachAxis.appendChild(span);
    }
  }
}
